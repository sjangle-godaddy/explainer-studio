<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { --bg: #050d1f; --panel: #0b1a38; --line: #1f3a6b; --text: #e7eefb; --muted: #8fa3c7; --amber: #ffb020; --cyan: #22d3ee; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; gap: 20px; padding: 16px; align-items: flex-start; justify-content: center;
  }
  .stage-wrap {
    position: relative; flex: 0 0 auto;
    height: min(calc(100vh - 32px), calc((100vw - 32px) * var(--ar)));
    aspect-ratio: var(--ar-css);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0, 0, 0, .5);
  }
  #stage { display: block; width: 100%; height: 100%; }
  .safe { position: absolute; border: 2px dashed #ff4d6d; box-shadow: 0 0 0 9999px rgba(255, 77, 109, .12); pointer-events: none; display: none; }
  .safe span { position: absolute; right: 4px; bottom: 4px; font: 600 11px system-ui, sans-serif; color: #ff4d6d; background: rgba(5, 13, 31, .8); padding: 1px 6px; border-radius: 4px; }
  .facecam { position: absolute; left: 0; right: 0; bottom: 0; display: none; place-items: center; color: #4a5a78; font: 600 13px system-ui, sans-serif; letter-spacing: .1em; border-top: 1px dashed #24324d; pointer-events: none; }
  .stage-wrap.full .facecam { display: grid; }
  .stage-wrap.show-safe .safe { display: block; }
  .panel { flex: 0 1 380px; min-width: 280px; max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 17px; margin: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select { font: inherit; color: var(--text); background: #13284f; border: 1px solid #2b4c86; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--cyan); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #1c3d78; border-color: var(--amber); }
  input[type=range] { width: 100%; accent-color: var(--amber); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 110px; }
  .notes { border-top: 1px solid var(--line); padding-top: 12px; }
  .notes .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
  .notes .line { font-size: 15px; }
  .status { font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  .status.ok { color: #34d399; }
  .status.bad { color: #ff4d6d; }
  kbd { background: #13284f; border: 1px solid #2b4c86; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  @media (max-width: 860px) {
    body { flex-direction: column; align-items: center; }
    .stage-wrap { height: auto; width: min(100%, calc((100vh - 32px) / var(--ar))); }
    .panel { width: 100%; max-height: none; flex: none; }
  }
</style>
</head>
<body>
<div class="stage-wrap" id="stageWrap">
  <canvas id="stage" aria-label="{{TITLE}}"></canvas>
  <div class="safe" id="safe"><span>SAFE ZONE</span></div>
  <div class="facecam" id="facecam">FACE CAM AREA</div>
</div>
<div class="panel">
  <h1 id="title"></h1>
  <div class="row">
    <button id="play" class="primary">Play</button>
    <button id="restart">Restart</button>
    <span class="time" id="time"></span>
  </div>
  <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Scrubber">
  <div class="row">
    <select id="scene" aria-label="Scene"></select>
    <label><input type="checkbox" id="safeToggle"> Safe zone</label>
  </div>
  <div class="row">
    <label>Frame <select id="frame">
      <option value="panel">Animation panel 1080 x 1280</option>
      <option value="full">Full 9:16 1080 x 1920 (face cam area blank)</option>
    </select></label>
  </div>
  <div class="row">
    <button id="mp4">Download MP4</button>
    <button id="webm">Record WebM</button>
  </div>
  <div class="status" id="exportStatus"></div>
  <div class="status" id="layoutStatus"></div>
  <div class="notes">
    <div class="k">Scene</div><div id="nBeat"></div>
    <div class="k">Spoken line</div><div class="line" id="nLine"></div>
    <div class="k">Layout and blocks</div><div id="nBlocks"></div>
    <div class="k">Focus</div><div id="nFocus"></div>
    <div class="k">Flows</div><div id="nFlows"></div>
  </div>
  <div class="status">
    <kbd>Space</kbd> play/pause &nbsp; <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> seek 1s (<kbd>Shift</kbd> 5s)<br>
    <kbd>&uarr;</kbd>/<kbd>&darr;</kbd> previous/next scene &nbsp; <kbd>Home</kbd> start &nbsp; <kbd>S</kbd> safe zone
  </div>
</div>
<script id="episode">
/*{{EPISODE}}*/
</script>
<script id="player">
/*{{PLAYER}}*/
</script>
</body>
</html>

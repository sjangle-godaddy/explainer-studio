<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPN vs VPC Peering vs Transit Gateway</title>
<style>
  :root { --bg: #050d1f; --panel: #0b1a38; --line: #1f3a6b; --text: #e7eefb; --muted: #8fa3c7; --amber: #ffb020; --cyan: #22d3ee; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; gap: 20px; padding: 16px; align-items: flex-start; justify-content: center;
  }
  .stage-wrap {
    position: relative; flex: 0 0 auto;
    height: min(calc(100vh - 32px), calc((100vw - 32px) * var(--ar)));
    aspect-ratio: var(--ar-css);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0, 0, 0, .5);
  }
  #stage { display: block; width: 100%; height: 100%; }
  .safe { position: absolute; border: 2px dashed #ff4d6d; box-shadow: 0 0 0 9999px rgba(255, 77, 109, .12); pointer-events: none; display: none; }
  .safe span { position: absolute; right: 4px; bottom: 4px; font: 600 11px system-ui, sans-serif; color: #ff4d6d; background: rgba(5, 13, 31, .8); padding: 1px 6px; border-radius: 4px; }
  .facecam { position: absolute; left: 0; right: 0; bottom: 0; display: none; place-items: center; color: #4a5a78; font: 600 13px system-ui, sans-serif; letter-spacing: .1em; border-top: 1px dashed #24324d; pointer-events: none; }
  .stage-wrap.full .facecam { display: grid; }
  .stage-wrap.show-safe .safe { display: block; }
  .panel { flex: 0 1 380px; min-width: 280px; max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 17px; margin: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select { font: inherit; color: var(--text); background: #13284f; border: 1px solid #2b4c86; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--cyan); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #1c3d78; border-color: var(--amber); }
  input[type=range] { width: 100%; accent-color: var(--amber); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 110px; }
  .notes { border-top: 1px solid var(--line); padding-top: 12px; }
  .notes .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
  .notes .line { font-size: 15px; }
  .status { font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  .status.ok { color: #34d399; }
  .status.bad { color: #ff4d6d; }
  kbd { background: #13284f; border: 1px solid #2b4c86; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  @media (max-width: 860px) {
    body { flex-direction: column; align-items: center; }
    .stage-wrap { height: auto; width: min(100%, calc((100vh - 32px) / var(--ar))); }
    .panel { width: 100%; max-height: none; flex: none; }
  }
</style>
</head>
<body>
<div class="stage-wrap" id="stageWrap">
  <canvas id="stage" aria-label="VPN vs VPC Peering vs Transit Gateway"></canvas>
  <div class="safe" id="safe"><span>SAFE ZONE</span></div>
  <div class="facecam" id="facecam">FACE CAM AREA</div>
</div>
<div class="panel">
  <h1 id="title"></h1>
  <div class="row">
    <button id="play" class="primary">Play</button>
    <button id="restart">Restart</button>
    <span class="time" id="time"></span>
  </div>
  <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Scrubber">
  <div class="row">
    <select id="scene" aria-label="Scene"></select>
    <label><input type="checkbox" id="safeToggle"> Safe zone</label>
  </div>
  <div class="row">
    <label>Frame <select id="frame">
      <option value="panel">Animation panel 1080 x 1280</option>
      <option value="full">Full 9:16 1080 x 1920 (face cam area blank)</option>
    </select></label>
  </div>
  <div class="row">
    <button id="mp4">Download MP4</button>
    <button id="webm">Record WebM</button>
  </div>
  <div class="status" id="exportStatus"></div>
  <div class="status" id="layoutStatus"></div>
  <div class="notes">
    <div class="k">Scene</div><div id="nBeat"></div>
    <div class="k">Spoken line</div><div class="line" id="nLine"></div>
    <div class="k">Layout and blocks</div><div id="nBlocks"></div>
    <div class="k">Focus</div><div id="nFocus"></div>
    <div class="k">Flows</div><div id="nFlows"></div>
  </div>
  <div class="status">
    <kbd>Space</kbd> play/pause &nbsp; <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> seek 1s (<kbd>Shift</kbd> 5s)<br>
    <kbd>&uarr;</kbd>/<kbd>&darr;</kbd> previous/next scene &nbsp; <kbd>Home</kbd> start &nbsp; <kbd>S</kbd> safe zone
  </div>
</div>

    } else if (e.key === "s" || e.key === "S") {
      safeToggle.checked = !safeToggle.checked;
      safeToggle.onchange?.(new Event("change"));
    }
  });
  var status = $("exportStatus");
  var buttons = ["mp4", "webm"].map((id) => $(id));
  var busy = (on) => {
    buttons.forEach((b) => b.disabled = on);
    frameSel.disabled = on;
  };
  var makeCanvas = () => {
    const c = document.createElement("canvas");
    c.width = th.W;
    c.height = frameHeight();
    return c;
  };
  var fileBase = () => `${E.id}-${th.W}x${frameHeight()}-${th.fps}fps`;
  function save(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
  }
  var loadScript = (src) => new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = res;
    s.onerror = () => rej(new Error("could not load " + src));
    document.head.appendChild(s);
  });
  async function exportMp4() {
    let encoder = null;
    if (!("VideoEncoder" in window)) {
      status.textContent = "This browser has no WebCodecs encoder. Use Record WebM, or run npm run render.";
      return;
    }
    pause();
    busy(true);
    status.className = "status";
    try {
      status.textContent = "Loading MP4 muxer...";
      if (!window.Mp4Muxer) await loadScript("https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js");
      const W = th.W, H = frameHeight(), fps = th.fps;
      let config = null;
      for (const codec of ["avc1.640032", "avc1.4d0032", "avc1.42e032", "avc1.640028"]) {
        const c = { codec, width: W, height: H, bitrate: 12e6, framerate: fps, avc: { format: "avc" } };
        if ((await VideoEncoder.isConfigSupported(c)).supported) {
          config = c;
          break;
        }
      }
      if (!config) throw new Error(`no supported H.264 configuration for ${W} x ${H}`);
      const M = window.Mp4Muxer;
      const muxer = new M.Muxer({ target: new M.ArrayBufferTarget(), video: { codec: "avc", width: W, height: H, frameRate: fps }, fastStart: "in-memory" });
      let encErr = null;
      encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => {
        encErr = e;
      } });
      encoder.configure(config);
      const canvas = makeCanvas(), c2 = canvas.getContext("2d");
      const frames = Math.round(E.duration * fps);
      for (let i = 0; i < frames; i++) {
        if (encErr) throw encErr;
        render(c2, i / fps);
        const vf = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
        encoder.encode(vf, { keyFrame: i % (fps * 2) === 0 });
        vf.close();
        while (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 1));
        if (i % 15 === 0) {
          status.textContent = `Encoding MP4 (keep this tab visible): frame ${i + 1} / ${frames}`;
          await new Promise((r) => setTimeout(r, 0));
        }
      }
      await encoder.flush();
      if (encErr) throw encErr;
      muxer.finalize();
      save(new Blob([muxer.target.buffer], { type: "video/mp4" }), fileBase() + ".mp4");
      status.textContent = `MP4 ready: ${frames} frames, ${W} x ${H}, ${fps} fps, silent (${config.codec}).`;
    } catch (e) {
      status.textContent = "MP4 export failed: " + e.message + ". Record WebM still works.";
    } finally {
      if (encoder && encoder.state !== "closed") encoder.close();
      busy(false);
    }
  }
  async function recordWebm() {
    pause();
    busy(true);
    status.className = "status";
    try {
      const canvas = makeCanvas(), c2 = canvas.getContext("2d"), fps = th.fps;
      render(c2, 0);
      const stream = canvas.captureStream(0), track = stream.getVideoTracks()[0];
      const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m));
      const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 });
      const chunks = [];
      rec.ondataavailable = (e) => {
        if (e.data.size) chunks.push(e.data);
      };
      const done = new Promise((r) => {
        rec.onstop = r;
      });
      rec.start();
      const frames = Math.round(E.duration * fps), t0 = performance.now();
      for (let i = 0; i < frames; i++) {
        render(c2, i / fps);
        track.requestFrame();
        const wait = t0 + (i + 1) * 1e3 / fps - performance.now();
        if (wait > 0) await new Promise((r) => setTimeout(r, wait));
        if (i % 15 === 0) status.textContent = `Recording WebM in real time (keep this tab visible): ${(i / fps).toFixed(1)}s / ${E.duration.toFixed(1)}s`;
      }
      await new Promise((r) => setTimeout(r, 1e3 / fps));
      rec.stop();
      await done;
      save(new Blob(chunks, { type: "video/webm" }), fileBase() + ".webm");
      status.textContent = "WebM ready (canvas only, silent).";
    } catch (e) {
      status.textContent = "WebM recording failed: " + e.message;
    } finally {
      busy(false);
    }
  }
  $("mp4").onclick = exportMp4;
  $("webm").onclick = recordWebm;
  (async function boot() {
    try {
      const face = new FontFace(th.font.family, `url(data:font/woff2;base64,${window.FONT_B64})`, { weight: "700" });
      await face.load();
      document.fonts.add(face);
    } catch (e) {
      console.warn("embedded font failed to load, using fallback", e);
    }
    $("layoutStatus").textContent = `${E.scenes.length} scenes, ${E.beats.length} beats, ${E.duration.toFixed(1)}s. Checks ran at build time.`;
    setFrame(frameSel.value);
    safeToggle.onchange?.(new Event("change"));
  })();
})();

</script>
</body>
</html>
